<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 530 370"
     width="530mm" height="370mm">

  <defs>
    <marker id="arrow-start" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse">
      <path d="M 6,0 L 0,3 L 6,6 Z" fill="#333"/>
    </marker>
    <marker id="arrow-end" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M 0,0 L 6,3 L 0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .cut { fill: none; stroke: #E60000; stroke-width: 0.5; stroke-linejoin: round; }
    .fold { fill: none; stroke: #0055CC; stroke-width: 0.35; stroke-dasharray: 3,1.5; }
    .panel-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 5px; fill: #444; text-anchor: middle; dominant-baseline: central; }
    .flap-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 3px; fill: #888; text-anchor: middle; dominant-baseline: central; }
    .dim-line { stroke: #333; stroke-width: 0.25; }
    .dim-arrow { stroke: #333; stroke-width: 0.25; marker-start: url(#arrow-start); marker-end: url(#arrow-end); }
    .dim-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 3.5px; fill: #333; text-anchor: middle; }
    .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 7px; fill: #222; font-weight: bold; text-anchor: middle; }
    .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 4px; fill: #666; text-anchor: middle; }
    .note { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 3px; fill: #999; text-anchor: middle; }
    .legend-cut { stroke: #E60000; stroke-width: 0.5; }
    .legend-fold { stroke: #0055CC; stroke-width: 0.35; stroke-dasharray: 3,1.5; }
    .legend-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 3.5px; fill: #333; }
    .recess { fill: none; stroke: #00AA00; stroke-width: 0.4; stroke-dasharray: 2,1.5; }
    .recess-fill { fill: #e8f4e8; stroke: none; opacity: 0.4; }
    .base-fill { fill: #f5f5f5; stroke: none; }
    .wall-fill { fill: #fef3e2; stroke: none; opacity: 0.5; }
    .tab-fill { fill: #f0f0f0; stroke: none; opacity: 0.5; }
    .recess-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 3.5px; fill: #00AA00; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- TRAY — FLAT DIELINE (identical for both Tray 1 and Tray 2) -->
  <!-- Tray exterior: 342.9 x 165.1 mm (13.5" x 6.5") -->
  <!-- Wall height: 50 mm (~1.97") — UPDATED from 28.575mm -->
  <!-- Material: 18pt paperboard, dark carbon fiber texture -->
  <!-- Two LANDSCAPE recesses: -->
  <!--   Top (back): wide, spans tray width — for tattoo+sticker boxes -->
  <!--   Bottom (front): pen-box sized only -->

  <!-- KEY COORDINATES (wall = 50mm): -->
  <!-- Base: x = 100 to 442.9 (342.9mm wide), y = 100 to 265.1 (165.1mm deep) -->
  <!-- Back wall: y = 50 to 100 -->
  <!-- Front wall: y = 265.1 to 315.1 -->
  <!-- Left wall: x = 50 to 100 -->
  <!-- Right wall: x = 442.9 to 492.9 -->
  <!-- Outer cut rect: x=50, y=50, w=442.9, h=265.1 -->
  <!-- Total flat: 442.9 x 265.1 mm -->

  <text x="265" y="14" class="title">TRAY — FLAT DIELINE (×2 IDENTICAL)</text>
  <text x="265" y="22" class="subtitle">342.9 × 165.1 × 50 mm (13.5" × 6.5" × ~2.0" walls) — 18pt paperboard</text>
  <text x="265" y="28" class="subtitle">Same mold for Tray 1 and Tray 2 — dark carbon fiber texture, prison orange trim on top edges</text>

  <line x1="55" y1="37" x2="70" y2="37" class="legend-cut" fill="none"/>
  <text x="73" y="38" class="legend-text" text-anchor="start">Cut / Die line</text>
  <line x1="120" y1="37" x2="135" y2="37" class="legend-fold" fill="none"/>
  <text x="138" y="38" class="legend-text" text-anchor="start">Fold / Crease line</text>
  <line x1="195" y1="37" x2="210" y2="37" class="recess" fill="none"/>
  <text x="213" y="38" class="legend-text" text-anchor="start">Die-cut recess (Pelican-style)</text>

  <!-- PANEL FILLS -->
  <!-- Base -->
  <rect x="100" y="100" width="342.9" height="165.1" class="base-fill"/>
  <!-- Walls -->
  <rect x="100" y="50" width="342.9" height="50" class="wall-fill"/>
  <rect x="100" y="265.1" width="342.9" height="50" class="wall-fill"/>
  <rect x="50" y="100" width="50" height="165.1" class="wall-fill"/>
  <rect x="442.9" y="100" width="50" height="165.1" class="wall-fill"/>
  <!-- Corner tabs -->
  <rect x="50" y="50" width="50" height="50" class="tab-fill"/>
  <rect x="442.9" y="50" width="50" height="50" class="tab-fill"/>
  <rect x="50" y="265.1" width="50" height="50" class="tab-fill"/>
  <rect x="442.9" y="265.1" width="50" height="50" class="tab-fill"/>

  <!-- CUT LINE — Outer outline -->
  <rect x="50" y="50" width="442.9" height="265.1" class="cut"/>

  <!-- Corner cuts -->
  <line x1="50" y1="50" x2="100" y2="100" class="cut"/>
  <line x1="442.9" y1="100" x2="492.9" y2="50" class="cut"/>
  <line x1="50" y1="315.1" x2="100" y2="265.1" class="cut"/>
  <line x1="442.9" y1="265.1" x2="492.9" y2="315.1" class="cut"/>

  <!-- FOLD LINES -->
  <line x1="100" y1="50" x2="100" y2="315.1" class="fold"/>
  <line x1="442.9" y1="50" x2="442.9" y2="315.1" class="fold"/>
  <line x1="50" y1="100" x2="492.9" y2="100" class="fold"/>
  <line x1="50" y1="265.1" x2="492.9" y2="265.1" class="fold"/>

  <!-- ============================================ -->
  <!-- DIE-CUT RECESSES — Landscape orientation     -->
  <!-- Two horizontal bands: wide at back, pen at front -->
  <!-- ============================================ -->

  <!-- RECESS A — Wide, toward back wall (top in flat view) -->
  <!-- Width=320mm, centered in base. x: 271.45-160=111.45 to 271.45+160=431.45 -->
  <!-- y: 105 to 197 (~92mm deep) -->
  <rect x="111.45" y="105" width="320" height="92" class="recess-fill"/>
  <rect x="111.45" y="105" width="320" height="92" class="recess"/>

  <text x="271.45" y="145" class="recess-label">RECESS A — WIDE (LANDSCAPE)</text>
  <text x="271.45" y="151" class="flap-label">~320 × ~92 mm — centered in base</text>
  <text x="271.45" y="157" class="flap-label">Tray 1: Tattoo box (127×88.9) + Sticker box (127×88.9) side by side</text>
  <text x="271.45" y="163" class="flap-label">Tray 2: 3× Card deck boxes (101.6×63.5 ea.) — ~7.6mm clearance per side</text>

  <!-- RECESS B — Pen-sized, toward front wall (bottom in flat view) -->
  <!-- x: 271.45 - 84 = 187.45, width=168 -->
  <!-- y: 212 to 260 (48mm, with gap from recess A) -->
  <rect x="187.45" y="212" width="168" height="48" class="recess-fill"/>
  <rect x="187.45" y="212" width="168" height="48" class="recess"/>

  <text x="271.45" y="233" class="recess-label">RECESS B — PEN SIZED</text>
  <text x="271.45" y="239" class="flap-label">~168 × ~48 mm — centered</text>
  <text x="271.45" y="245" class="flap-label">Tray 1: Pen box (165.1×44.45) — snug fit</text>
  <text x="271.45" y="251" class="flap-label">Tray 2: Stapler chalk outline</text>

  <!-- PANEL LABELS -->
  <text x="271.45" y="75" class="panel-label">BACK WALL (toward divider / back of briefcase)</text>
  <text x="271.45" y="290" class="panel-label">FRONT WALL (toward handle / front of briefcase)</text>
  <text x="75" y="182.55" class="panel-label" transform="rotate(-90, 75, 182.55)">LEFT WALL</text>
  <text x="467.9" y="182.55" class="panel-label" transform="rotate(-90, 467.9, 182.55)">RIGHT WALL</text>

  <text x="68" y="60" class="flap-label">TAB</text>
  <text x="475" y="60" class="flap-label">TAB</text>
  <text x="68" y="308" class="flap-label">TAB</text>
  <text x="475" y="308" class="flap-label">TAB</text>

  <!-- DIMENSION ANNOTATIONS -->

  <!-- Bottom: base width -->
  <line x1="100" y1="315.1" x2="100" y2="333" class="dim-line"/>
  <line x1="442.9" y1="315.1" x2="442.9" y2="333" class="dim-line"/>
  <line x1="100" y1="329" x2="442.9" y2="329" class="dim-arrow"/>
  <text x="271.45" y="327" class="dim-text">Base width: 342.9 mm (13.5")</text>

  <!-- Bottom: total with walls -->
  <line x1="50" y1="315.1" x2="50" y2="339" class="dim-line"/>
  <line x1="492.9" y1="315.1" x2="492.9" y2="339" class="dim-line"/>
  <line x1="50" y1="336" x2="492.9" y2="336" class="dim-arrow"/>
  <text x="271.45" y="334" class="dim-text">Total flat width: 442.9 mm</text>

  <!-- Right side: base depth -->
  <line x1="492.9" y1="100" x2="510" y2="100" class="dim-line"/>
  <line x1="492.9" y1="265.1" x2="510" y2="265.1" class="dim-line"/>
  <line x1="507" y1="100" x2="507" y2="265.1" class="dim-arrow"/>
  <text x="507" y="182.55" class="dim-text" transform="rotate(-90, 507, 182.55)">Base depth: 165.1 mm (6.5")</text>

  <!-- Right side: wall height -->
  <line x1="492.9" y1="50" x2="500" y2="50" class="dim-line"/>
  <line x1="497" y1="50" x2="497" y2="100" class="dim-arrow"/>
  <text x="497" y="75" class="dim-text" transform="rotate(-90, 497, 75)">50.0</text>

  <line x1="497" y1="265.1" x2="497" y2="315.1" class="dim-arrow"/>
  <text x="497" y="290" class="dim-text" transform="rotate(-90, 497, 290)">50.0</text>

  <!-- Total height -->
  <line x1="517" y1="50" x2="517" y2="315.1" class="dim-arrow"/>
  <line x1="513" y1="50" x2="521" y2="50" class="dim-line"/>
  <line x1="513" y1="315.1" x2="521" y2="315.1" class="dim-line"/>
  <text x="517" y="182.55" class="dim-text" transform="rotate(-90, 517, 182.55)">Total flat: 265.1 mm</text>

  <!-- Recess A depth dimension (left side) -->
  <line x1="100" y1="105" x2="45" y2="105" class="dim-line"/>
  <line x1="100" y1="197" x2="45" y2="197" class="dim-line"/>
  <line x1="38" y1="105" x2="38" y2="197" class="dim-arrow"/>
  <text x="38" y="151" class="dim-text" transform="rotate(-90, 38, 151)">~92 (recess A)</text>

  <!-- Recess B depth dimension (left side) -->
  <line x1="187.45" y1="212" x2="45" y2="212" class="dim-line"/>
  <line x1="187.45" y1="260" x2="45" y2="260" class="dim-line"/>
  <line x1="38" y1="212" x2="38" y2="260" class="dim-arrow"/>
  <text x="38" y="236" class="dim-text" transform="rotate(-90, 38, 236)">~48 (recess B)</text>

  <!-- NOTES -->
  <text x="265" y="348" class="note">Both trays use identical mold. Two landscape Pelican-style die-cut recesses: wide at back, pen-sized at front.</text>
  <text x="265" y="353" class="note">Recess A spans full tray width for tattoo+sticker boxes. Recess B is pen-box-sized only, centered.</text>
  <text x="265" y="358" class="note">Finger notches on left/right walls (rectangular cutouts with orange U-trim, not shown). Decorative tab(s) on back edge.</text>
  <text x="265" y="363" class="note">Wall height updated to 50mm (~2.0") — two trays stack to match back compartment height with clearance for manual on top.</text>


</svg>
